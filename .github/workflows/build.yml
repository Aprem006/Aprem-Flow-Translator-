          <com.google.android.material.button.MaterialButton android:id="@+id/btnStop" style="@style/Widget.Material3.Button.OutlinedButton" android:layout_width="match_parent" android:layout_height="52dp" android:layout_marginStart="16dp" android:layout_marginTop="10dp" android:layout_marginEnd="16dp" android:text="Stop" android:textColor="@color/primary" app:cornerRadius="26dp" />
          <com.google.android.material.card.MaterialCardView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_margin="16dp" app:cardBackgroundColor="@color/white" app:cardCornerRadius="20dp" app:cardElevation="0dp" app:strokeColor="@color/stroke" app:strokeWidth="1dp">
