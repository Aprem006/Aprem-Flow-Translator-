          cat > app/src/main/res/layout/activity_main.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/bg" android:fillViewport="true">
          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
          <FrameLayout android:layout_width="match_parent" android:layout_height="310dp">
          <com.google.android.material.imageview.ShapeableImageView android:layout_width="match_parent" android:layout_height="match_parent" android:scaleType="centerCrop" android:src="@drawable/banner" app:shapeAppearanceOverlay="@style/BottomRound" />
          <View android:layout_width="match_parent" android:layout_height="match_parent" android:background="@drawable/scrim" />
          <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="bottom|center_horizontal" android:orientation="vertical" android:paddingStart="24dp" android:paddingEnd="24dp" android:paddingBottom="28dp">
          <com.google.android.material.imageview.ShapeableImageView android:layout_width="84dp" android:layout_height="84dp" android:padding="3dp" android:scaleType="centerCrop" android:src="@drawable/logo" app:shapeAppearanceOverlay="@style/CircleImage" app:strokeColor="@color/white" app:strokeWidth="3dp" />
          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="12dp" android:text="LingoFloat" android:textColor="@color/white" android:textSize="30sp" android:textStyle="bold" />
          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="2dp" android:gravity="center" android:text="Indonesian \u2192 English, right on your screen" android:textColor="@color/white" android:textSize="15sp" />
          </LinearLayout>
          </FrameLayout>

          <com.google.android.material.card.MaterialCardView android:id="@+id/statusCard" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_margin="16dp" app:cardBackgroundColor="@color/white" app:cardCornerRadius="20dp" app:cardElevation="0dp" app:strokeColor="@color/stroke" app:strokeWidth="1dp">
          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center_vertical" android:orientation="horizontal" android:padding="16dp">
          <FrameLayout android:layout_width="40dp" android:layout_height="40dp">
