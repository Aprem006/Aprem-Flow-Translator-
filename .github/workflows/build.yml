name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/prem/lingofloat app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/res/drawable-nodpi app/src/main/res/mipmap-anydpi-v26
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "LingoFloat"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
          id("com.android.application") version "8.5.2" apply false
          id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF_FILE
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
          }
          android {
          namespace = "com.prem.lingofloat"
          compileSdk = 34
          defaultConfig {
          applicationId = "com.prem.lingofloat"
          minSdk = 26
          targetSdk = 34
          versionCode = 1
          versionName = "1.0"
          ndk { abiFilters += listOf("arm64-v8a") }
          }
          signingConfigs {
          getByName("debug") {
          val ks = rootProject.file("share.jks")
          if (ks.exists()) {
          storeFile = ks
          storePassword = "lingofloat"
          keyAlias = "lingo"
          keyPassword = "lingofloat"
          }
          }
          }
          compileOptions {
          sourceCompatibility = JavaVersion.VERSION_17
          targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = "17" }
          }
          dependencies {

         implementation("androidx.core:core-ktx:1.13.1")
          implementation("androidx.appcompat:appcompat:1.7.0")
          implementation("com.google.android.material:material:1.12.0")
          implementation("com.google.mlkit:text-recognition:16.0.1")
          implementation("com.google.mlkit:translate:17.0.3")
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <application
          android:allowBackup="false"
          android:icon="@mipmap/ic_launcher"
          android:roundIcon="@mipmap/ic_launcher"
          android:label="LingoFloat"
          android:theme="@style/Theme.LingoFloat">
          <activity android:name=".MainActivity" android:exported="true">
          <intent-filter>
          <action android:name="android.intent.action.MAIN" />
          <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
          </activity>
          <service
          android:name=".TranslatorService"
          android:exported="false"
          android:foregroundServiceType="mediaProjection" />
          </application>
          </manifest>
          EOF_FILE
          cat > app/src/main/res/values/values.xml <<'EOF_FILE'
          <resources>
          <color name="white">#FFFFFF</color>
          <color name="primary">#9B2D3F</color>
          <color name="bg">#FBF7F2</color>
          <color name="ink">#2B2024</color>
          <color name="sub">#7A6A6A</color>
          <color name="stroke">#E9DFD6</color>
          <style name="Theme.LingoFloat" parent="Theme.Material3.Light.NoActionBar">
          <item name="colorPrimary">@color/primary</item>
          <item name="colorOnPrimary">@color/white</item>
          <item name="android:statusBarColor">@color/primary</item>
          <item
          name="android:windowLightStatusBar">false</item>
          <item name="android:windowBackground">@color/bg</item>
          </style>
          <style name="CircleImage">
          <item name="cornerFamily">rounded</item>
          <item name="cornerSize">50%</item>
          </style>
          <style name="BottomRound">
          <item name="cornerFamily">rounded</item>
          <item name="cornerSizeTopLeft">0dp</item>
          <item name="cornerSizeTopRight">0dp</item>
          <item name="cornerSizeBottomLeft">32dp</item>
          <item name="cornerSizeBottomRight">32dp</item>
