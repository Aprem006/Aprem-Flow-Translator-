          <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="10dp" android:lineSpacingExtra="6dp" android:text="1.  Tap Start and allow the two permissions\n2.  Open any app: comics, chats, websites\n3.  Tap the floating bubble and the Indonesian turns into English\n4.  Tap the translation to close it\n5.  Hold the bubble to stop" android:textColor="@color/ink" android:textSize="15sp" />
          </LinearLayout>
          </com.google.android.material.card.MaterialCardView>
          <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center" android:padding="20dp" android:text="v1.0  \u00B7  Made with \u2665 by Prem" android:textColor="@color/sub" android:textSize="13sp" />
